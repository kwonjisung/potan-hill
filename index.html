<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0e19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>포탄 언덕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one column — battlefield canvas on top, a chunky control console below; setup is a 4-slot roster grid */
:root{
  color-scheme:dark;
  --bg:#1c0e19; --console:#2c1426; --slot:#3b1a32; --line:#5c2a45; --fg:#ffeedd; --muted:#dcb3a0; --cream:#ffe9c7;
  --accent:#ffd15a; --hot:#ff8a2a; --good:#7fd17a; --ink:#1a0912;
  --f-bungee:'Bungee','Black Han Sans',sans-serif;
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;line-height:1;color:var(--accent);letter-spacing:.02em}
h1 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600;margin-left:10px;letter-spacing:0}
.hbtns{display:flex;gap:8px}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{background:var(--slot);border:2px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:20px;padding:10px 28px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}

.ptag{font-family:var(--f-display);font-size:18px;padding:2px 10px;border-radius:6px;color:var(--ink);line-height:1.3}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-weight:600;font-size:13px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.opt{display:flex;align-items:center;gap:8px}
.opt>label{font-weight:700;font-size:13px;color:var(--muted)}
.warn{color:var(--hot);font-weight:600;font-size:13px}
.keys{color:var(--muted);font-size:13px;margin:0}
kbd{font-family:var(--f-num);font-size:12px;background:var(--slot);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
/* quit confirm */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(14,6,12,.66)}
.mcard{background:var(--console);border:2px solid var(--accent);border-radius:14px;padding:20px 24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mcard h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--accent)}
.mcard p{margin:0;color:var(--muted)}
.mcard .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn.danger{background:var(--hot);border-color:var(--hot);color:var(--ink)}
/* setup · 황혼 전장 */
.maps{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.maps h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--accent)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.mapc{display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:10px;padding:5px 5px 7px;text-align:left;color:var(--cream);min-width:0}
.mapc canvas{display:block;width:100%;max-width:100%;aspect-ratio:2/1;border-radius:6px;background:#140810}
.mapc b{font-size:12px;margin-top:2px}.mapc small{font-size:10px;color:var(--muted)}
.mapc[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,209,90,.12)}
#setup{display:flex;flex-direction:column;gap:12px}
.banner{position:relative;aspect-ratio:16/3;overflow:hidden;border-radius:12px;border:2px solid var(--line);container-type:inline-size}
.banner canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner .logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.banner .kick{font-family:var(--f-bungee);font-size:1.05cqw;letter-spacing:.55em;margin-left:.55em;color:var(--cream);opacity:.85}
.banner .name{position:relative;display:inline-block;font-family:var(--f-display);font-weight:400;font-size:9.5cqw;line-height:1;margin:.3cqw 0 0;color:#5b1d0b;
  text-shadow:0 .15cqw 0 #74270f,0 .3cqw 0 #6a230e,0 .45cqw 0 #5e1f0c,0 .6cqw 0 #50190a,0 .75cqw 0 #421408,0 1.4cqw 1.4cqw rgba(20,0,10,.6)}
.banner .name::after{content:attr(data-t);position:absolute;inset:0;background:linear-gradient(180deg,#fff6d6 0%,#ffd15a 36%,#ff8a2a 64%,#c93a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.07cqw rgba(80,18,4,.55)}
.banner .name .gl{position:absolute;inset:0;z-index:1;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gleam 3.6s ease-in-out infinite}
@keyframes gleam{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
.banner .sub{display:flex;align-items:center;gap:1.2cqw;font-family:var(--f-bungee);font-size:1.8cqw;color:var(--cream);letter-spacing:.3em;margin-top:.7cqw}
.banner .sub::before,.banner .sub::after{content:"";width:6cqw;height:.22cqw;background:linear-gradient(90deg,transparent,var(--accent))}
.banner .sub::after{transform:scaleX(-1)}
.sel{background:linear-gradient(180deg,rgba(38,16,32,.84),rgba(58,22,40,.8));border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,47fr) minmax(0,53fr);gap:10px 16px;color:var(--cream);max-width:1040px;width:100%;margin-inline:auto;backdrop-filter:blur(2px)}
.shead{grid-column:1/-1;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.shead h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--accent);text-shadow:0 2px 0 #5b1d0b}
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:9px;padding:3px 9px 3px 4px;font-size:13px;font-weight:600;color:var(--cream)}
.stab small{color:var(--muted);font-weight:400;font-size:11px}
.stab.off span:not(.ptag){color:var(--muted)}
.stab[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,209,90,.12)}
.stab .ptag{font-size:13px;padding:0 6px}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,209,90,.32),0 12px 28px rgba(0,0,0,.4)}
.stagecv{display:block;width:100%;max-width:100%;aspect-ratio:2/1}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);background:rgba(38,16,29,.7);color:var(--accent);font-size:15px}
.arrow.l{left:8px}.arrow.r{right:8px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{display:flex;flex-direction:column;gap:7px;min-width:0}
.slotline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slotline .ptag{font-size:15px}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tn{font-family:var(--f-display);font-size:34px;line-height:1;color:#fff3dd;text-shadow:0 3px 0 #5b1d0b}
.tc{display:inline-block;font-weight:700;font-size:12px;color:#3a1206;background:var(--accent);border-radius:6px;padding:1px 7px}
.info .blurb{margin:0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:4px 9px;align-items:center;font-size:12px}
.stats .n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sbar{height:7px;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.35)}
.sbar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--accent),var(--hot));transition:width .35s}
.wrow{border-radius:9px;padding:6px 9px;background:rgba(0,0,0,.22);border:1px solid rgba(255,209,90,.18);transition:background .2s,transform .2s;min-width:0}
.wrow b{display:block;color:var(--accent);font-size:13px}.wrow b small{font-weight:400;color:var(--muted)}.wrow span{font-size:12px;color:var(--muted)}
.wrow.firing{background:rgba(255,138,42,.22);border-color:var(--hot);transform:translateY(-2px)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:2px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:9px;padding:3px 3px 4px;font-size:11px;color:var(--muted);min-width:0}
.chip canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:72/44}
.chip[aria-pressed="true"]{border-color:var(--accent);color:#fff3dd;background:rgba(255,209,90,.12)}
.opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-top:1px solid rgba(255,209,90,.18);padding-top:10px}
.opts .warn{flex:1}
.go{font-family:var(--f-display);font-size:20px;color:#3a1206;background:linear-gradient(180deg,#ffe48a,#ffb43a 55%,#ff8a2a);border:2px solid #3a1206;border-radius:99px;padding:6px 26px;box-shadow:0 3px 0 #3a1206,0 0 20px rgba(255,170,60,.45);margin-left:auto}
.go:disabled{box-shadow:none}
.mapbg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.mapbg i{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.mapbg i.on{opacity:1}
.hbtns .btn{display:inline-flex;align-items:center;gap:6px}
#modeSeg button{display:inline-flex;align-items:center;gap:5px}
.mi{width:15px;height:15px;flex:none}
.stab .ml{display:inline-flex;align-items:center;gap:3px}
.stab .ml .mi{width:12px;height:12px}
.hbtns .btn svg{width:16px;height:16px;flex:none}
@media (max-width:820px){.sel{grid-template-columns:minmax(0,1fr)}.tn{font-size:30px}.go{margin-left:0;width:100%}}

/* play */
#play{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
#game{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:2/1;touch-action:none}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,18,22,.62);padding:12px}
.over .card{background:var(--console);border:2px solid var(--accent);border-radius:12px;padding:16px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.over h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,36px);margin:0;color:var(--accent)}
.over p{margin:0;color:var(--muted)}
.over .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.console,.pad{transition:filter .8s}
.spectate .console,.spectate .pad{filter:grayscale(.7) brightness(.9)}
.console{background:var(--console);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:minmax(150px,auto) auto minmax(180px,1fr) auto auto;gap:10px 20px;align-items:center}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;line-height:1.1}
.who small{color:var(--muted);font-size:12px}
.cap{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.read{display:flex;flex-direction:column}
.read .v{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.read .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.gauges{display:flex;flex-direction:column;gap:6px;min-width:0}
.g{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}
.g .n{font-family:var(--f-num);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:16px;background:var(--ink);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.13) calc(10% - 1px) 10%)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f2b632,#ff6b4a)}
.bar.fuel{height:10px}
.bar.fuel i{background:#5cc8ff}
.bar em{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px var(--ink);z-index:1}
.weapons{display:flex;gap:8px}
.wbtn{background:var(--slot);border:2px solid var(--line);border-radius:8px;padding:6px 10px;text-align:left;min-width:104px}
.wbtn b{display:block;font-size:14px}
.wbtn small{color:var(--muted);font-size:11px}
.wbtn[aria-pressed="true"]{border-color:var(--accent);background:#2b4b52}
.timer{font-family:var(--f-num);font-size:30px;font-weight:600;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.timer.low{color:var(--hot)}
.pad{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grp{display:flex;gap:8px}
.pbtn{min-width:60px;height:54px;background:var(--slot);border:2px solid var(--line);border-radius:10px;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
.pbtn.on{border-color:var(--accent);background:#2b4b52}
.fire{flex:1;min-width:140px;max-width:320px;height:54px;background:var(--hot);border:2px solid var(--hot);border-radius:10px;color:var(--ink);font-family:var(--f-display);font-size:22px;user-select:none;-webkit-user-select:none;touch-action:none}
.fire.on{filter:brightness(1.15)}
#play,.pad,.pbtn,.fire{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pbtn,.fire,.wbtn,.btn{touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* phone · portrait */
@media (max-width:820px) and (orientation:portrait),(max-width:560px){
  .app{padding-inline:10px;padding-block:8px 0;gap:8px}
  header{flex-wrap:nowrap}
  h1{font-size:22px}
  h1 small{display:none}
  .hbtns{gap:6px;margin-left:auto}
  .hbtns .btn{padding:6px 8px;min-height:36px}
  .hbtns .btn .lt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #play{gap:8px}
  .stage{border-radius:10px;margin-inline:-4px}
  .console{grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;padding:8px 10px}
  .who b{font-size:17px}.who small{font-size:11px}.who .ptag{font-size:15px}
  .read .v{font-size:20px}.read .cap{font-size:10px}
  .gauges{grid-column:1/-1;order:3}
  .g{grid-template-columns:30px 1fr 28px;gap:6px}
  .weapons{grid-column:1/-1;order:4;display:grid;grid-template-columns:1fr 1fr}
  .wbtn{min-width:0;padding:5px 8px}.wbtn b{font-size:13px}
  .timer{font-size:22px}
  .pad{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 18%);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
  .pad .grp:first-child{order:1}.pad .fire{order:2;max-width:none;min-width:0;height:60px;font-size:22px}.pad .grp:nth-child(2){order:3}
  .pad .keys,.fire .lt2{display:none}
  .pbtn{min-width:52px;height:60px;font-size:22px;border-radius:12px}
}
/* phone · landscape */
@media (orientation:landscape) and (max-height:520px){
  .app{padding-inline:max(10px,env(safe-area-inset-left,0px));padding-block:6px 4px;gap:6px}
  header{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:30}
  #setup~header,body:has(#setup:not([hidden])) header{position:static}
  h1{display:none}
  .hbtns{gap:5px}
  .hbtns .btn{padding:5px 7px;font-size:12px;background:rgba(28,14,25,.78)}
  .hbtns .btn .lt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #play{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"stage stage stage stage" "mv con ang fire";gap:6px 8px;align-items:center}
  .stage{grid-area:stage;width:min(100%,calc((100dvh - 84px)*2));justify-self:center;border-radius:8px}
  .console{grid-area:con;display:flex;align-items:center;gap:10px;padding:5px 10px;min-width:0}
  .who small,.read .cap,.g .cap{display:none}
  .who{gap:6px;flex:none}.who b{font-size:15px}.who .ptag{font-size:13px;padding:1px 6px}
  .read .v{font-size:17px}.read .v small{display:none}
  .gauges{flex:1;gap:3px}.g{grid-template-columns:1fr 26px;gap:5px}.bar{height:11px}.bar.fuel{height:5px}
  .weapons{gap:5px;flex:none}.wbtn{min-width:0;padding:3px 7px}.wbtn b{font-size:12px}.wbtn small{display:none}
  .timer{font-size:18px;flex:none}
  .pad{display:contents}
  .pad .grp:first-child{grid-area:mv}.pad .grp:nth-child(2){grid-area:ang}.pad .fire{grid-area:fire}
  .pad .keys,.fire .lt2{display:none}
  .pbtn{min-width:46px;height:48px;font-size:18px}
  .fire{min-width:92px;max-width:none;height:48px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="mapbg" aria-hidden="true"><i id="bgA"></i><i id="bgB"></i></div>
<div class="app">
  <header>
    <h1 id="hTitle" hidden>포탄 언덕 <small>각도·파워·바람으로 겨루는 턴제 포격전</small></h1>
    <div class="hbtns">
      <button class="btn" id="musBtn" type="button" aria-pressed="true">음악 켜짐</button>
      <button class="btn" id="sndBtn" type="button" aria-pressed="true">효과음 켜짐</button>
      <button class="btn" id="backBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/><path d="M9 12h11"/></svg><span class="lt">탱크 다시 고르기</span></button>
    </div>
  </header>

  <section id="setup">
    <div class="banner">
      <canvas class="bg" id="bannerCv" aria-hidden="true"></canvas>
      <div class="logo">
        <div class="kick">TURN-BASED ARTILLERY</div>
        <h2 class="name" data-t="포탄 언덕">포탄 언덕<span class="gl" aria-hidden="true">포탄 언덕</span></h2>
        <div class="sub">TANK HILL</div>
      </div>
    </div>
    <div class="sel">
      <div class="shead"><h3>탱크 선택</h3><div class="stabs" id="slotTabs"></div></div>
      <div class="left">
        <div class="stage"><canvas class="stagecv" id="stageCv"></canvas>
          <button class="arrow l" id="prevT" type="button" aria-label="이전 탱크">◀</button>
          <button class="arrow r" id="nextT" type="button" aria-label="다음 탱크">▶</button></div>

/* ---------- colour + shapes ---------- */
function rgbA(c,a=1){return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}
function hex2(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,a){const c=hex2(h);const t=a>0?255:0,k=Math.abs(a);return`rgb(${c.map(v=>Math.round(v+(t-v)*k)).join(',')})`}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const INK={dusk:'rgba(40,10,20,.0)',toy:'#1d2f6f',holo:'#59d4ff'};

/* pseudo-3D tank: style = dusk(gloss) | toy(clay, outline) | holo(metal, cyan rim) */
function drawTank3D(c,td,x,y,s,facing,ang,style,recoil=0,alpha=1,treadT=0,tilt=0){
  const col=td.color;c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=alpha;
  const ink=style==='toy'?'#1d2f6f':null;
  // ground shadow
  c.fillStyle=style==='holo'?'rgba(89,212,255,.22)':'rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,1.5,20,3.6,0,0,7);c.fill();
  // barrel (cylinder)
  c.save();c.translate(0,-17);c.scale(facing,1);c.rotate(-ang*Math.PI/180);c.translate(-recoil,0);
  const bw=td.id==='heavy'?7:5,L=td.barrel;
  let g=c.createLinearGradient(0,-bw/2,0,bw/2);g.addColorStop(0,'#2a2e33');g.addColorStop(.3,'#8d969e');g.addColorStop(.55,'#4b5258');g.addColorStop(1,'#1b1e21');
  c.fillStyle=g;rr(c,0,-bw/2,L,bw,bw/2);c.fill();if(ink){c.strokeStyle=ink;c.lineWidth=1.2;c.stroke()}
  g=c.createLinearGradient(0,-bw/2-1,0,bw/2+1);g.addColorStop(0,'#3a3f44');g.addColorStop(.35,'#aab3ba');g.addColorStop(1,'#25292d');
  c.fillStyle=g;rr(c,L-5,-bw/2-1.2,5.5,bw+2.4,1.5);c.fill();if(ink)c.stroke();
  if(style==='holo'){c.strokeStyle='rgba(89,212,255,.8)';c.lineWidth=.7;c.beginPath();c.moveTo(1,-bw/2);c.lineTo(L-1,-bw/2);c.stroke()}
  c.restore();
  c.rotate(tilt);c.scale(facing,1);if(td.id==='heavy')c.scale(1.15,1.12);
  // tracks
  g=c.createLinearGradient(0,-9,0,1);g.addColorStop(0,'#4a5056');g.addColorStop(.25,'#2a2e33');g.addColorStop(1,'#121416');
  c.fillStyle=g;rr(c,-17,-9,34,10,5);c.fill();if(ink){c.strokeStyle=ink;c.lineWidth=1.4;c.stroke()}
  c.save();rr(c,-17,-9,34,10,5);c.clip();c.strokeStyle='rgba(255,255,255,.09)';c.lineWidth=1.2;
  for(let i=0;i<10;i++){const tx=-18+((i*4+treadT)%36);c.beginPath();c.moveTo(tx,-9);c.lineTo(tx,1);c.stroke()}c.restore();
  for(const wx of [-11.5,-4,3.5,11]){g=c.createRadialGradient(wx-.8,-4.8,.3,wx,-4,3.3);g.addColorStop(0,'#c9d0d6');g.addColorStop(.6,'#6a7178');g.addColorStop(1,'#2e3337');
    c.fillStyle=g;c.beginPath();c.arc(wx,-4,3.1,0,7);c.fill();c.fillStyle='#2b2f33';c.beginPath();c.arc(wx,-4,1,0,7);c.fill()}
  // fender
  c.fillStyle=shade(col,-.45);c.beginPath();c.moveTo(-17,-8.5);c.lineTo(17,-8.5);c.lineTo(15.5,-10.5);c.lineTo(-15.5,-10.5);c.closePath();c.fill();if(ink)c.stroke();
  // hull front face
  g=c.createLinearGradient(0,-16,0,-9);g.addColorStop(0,shade(col,.12));g.addColorStop(1,shade(col,-.3));
  c.fillStyle=g;c.beginPath();c.moveTo(-14.5,-10);c.lineTo(14.5,-10);c.lineTo(11.5,-16);c.lineTo(-12.5,-16);c.closePath();c.fill();if(ink)c.stroke();
  // hull top face
  c.fillStyle=shade(col,.32);c.beginPath();c.moveTo(-12.5,-16);c.lineTo(11.5,-16);c.lineTo(8.5,-19);c.lineTo(-10,-19);c.closePath();c.fill();if(ink)c.stroke();
  if(style==='dusk'){c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.moveTo(-6,-16);c.lineTo(-2,-16);c.lineTo(-5,-10);c.lineTo(-9,-10);c.closePath();c.fill()}
  if(style==='holo'){c.strokeStyle='rgba(89,212,255,.9)';c.lineWidth=.8;c.beginPath();c.moveTo(-10,-19);c.lineTo(8.5,-19);c.lineTo(11.5,-16);c.stroke();
    c.strokeStyle='rgba(0,0,0,.25)';c.beginPath();c.moveTo(0,-16);c.lineTo(0,-10);c.moveTo(-7,-16);c.lineTo(-7.5,-10);c.stroke()}
  // dome (sphere)
  g=c.createRadialGradient(-2.6,-22,.6,0,-18,8.5);g.addColorStop(0,shade(col,.55));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.4));
  c.fillStyle=g;c.beginPath();c.arc(0,-18,7.5,Math.PI,0);c.lineTo(7.5,-17.5);c.lineTo(-7.5,-17.5);c.closePath();c.fill();if(ink)c.stroke();
  if(style!=='toy'){c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.ellipse(-3,-22.2,1.8,1.1,-.5,0,7);c.fill()}
  else{c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-3,-21.5,2.2,1.2,-.5,0,7);c.fill()}
  if(style==='holo'){c.strokeStyle='rgba(89,212,255,.85)';c.lineWidth=.8;c.beginPath();c.arc(0,-18,7.5,Math.PI*1.05,Math.PI*1.6);c.stroke()}
  c.translate(0,-4);deco(c,td,ink);c.restore();
}
function deco(c,td,ink){
  const dk=td.dark;c.lineWidth=1.2;
  const st=()=>{if(ink){c.strokeStyle=ink;c.stroke()}};
  switch(td.id){
    case 'iron':c.fillStyle=dk;for(const i of [-8,-3,2,7]){c.beginPath();c.arc(i,-6.5,1.1,0,7);c.fill()}break;
    case 'split':c.fillStyle=dk;c.beginPath();c.moveTo(-11,-12);c.lineTo(-19,-21);c.lineTo(-7,-14);c.closePath();c.fill();st();c.beginPath();c.moveTo(-7,-14);c.lineTo(-11.5,-23);c.lineTo(-3,-15);c.closePath();c.fill();st();break;
    case 'roll':c.fillStyle='#202326';c.beginPath();c.arc(-14,-13,5.5,0,7);c.fill();st();c.fillStyle='#d8c39a';c.beginPath();c.arc(-14,-13,2,0,7);c.fill();break;
    case 'mole':{const g=c.createLinearGradient(13,-12,13,-4);g.addColorStop(0,'#eef1f4');g.addColorStop(1,'#80878e');c.fillStyle=g;c.beginPath();c.moveTo(13,-3);c.lineTo(13,-11);c.lineTo(23,-7);c.closePath();c.fill();st();
      c.fillStyle='#ffd36b';c.beginPath();c.arc(2,-15,1.9,0,7);c.arc(-2.5,-15,1.9,0,7);c.fill();break}
    case 'storm':c.strokeStyle='#202326';c.lineWidth=1.5;c.beginPath();c.moveTo(-3,-19);c.lineTo(-5,-26);c.stroke();
      c.fillStyle='#eef7fb';c.beginPath();c.arc(-8,-29,4,0,7);c.arc(-3,-31,5,0,7);c.arc(2,-29,3.8,0,7);c.fill();st();
      c.fillStyle='#ffd166';c.beginPath();c.moveTo(-3,-27);c.lineTo(-6,-22);c.lineTo(-3.5,-22.5);c.lineTo(-5,-18);c.lineTo(-1,-24);c.lineTo(-3.5,-23.5);c.closePath();c.fill();break;
    case 'prism':{const g=c.createLinearGradient(-4,-30,4,-19);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#d7c6ff');g.addColorStop(1,'#8b6fd6');c.fillStyle=g;c.strokeStyle=ink||dk;
      c.beginPath();c.moveTo(0,-31);c.lineTo(4.5,-25);c.lineTo(0,-19.5);c.lineTo(-4.5,-25);c.closePath();c.fill();c.stroke();break}
    case 'garden':c.strokeStyle='#2f6b1a';c.lineWidth=1.6;c.beginPath();c.moveTo(0,-20);c.lineTo(0,-27);c.stroke();
      c.fillStyle='#8fe06a';c.beginPath();c.ellipse(-3.5,-27,4,2,-.5,0,7);c.fill();st();c.beginPath();c.ellipse(3.5,-28,4,2,.5,0,7);c.fill();st();break;
    case 'bat':c.fillStyle=dk;c.beginPath();c.moveTo(-6,-18);c.lineTo(-9,-27);c.lineTo(-1,-20);c.closePath();c.fill();st();c.beginPath();c.moveTo(1,-20);c.lineTo(5,-27);c.lineTo(6,-18);c.closePath();c.fill();st();
      c.fillStyle='#ffe066';c.beginPath();c.arc(-2.5,-15,1.3,0,7);c.arc(2.5,-15,1.3,0,7);c.fill();break;
    case 'fire':c.fillStyle='rgba(255,255,255,.75)';for(const sx of [-9,-3,3])c.fillRect(sx,-11.5,2.4,6);
      c.fillStyle='#ffd166';c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?1.6:3.6;c.lineTo(9+Math.cos(a)*r,-8.5+Math.sin(a)*r)}c.closePath();c.fill();st();break;
    case 'heavy':c.fillStyle=dk;c.fillRect(-12,-11.5,24,2.5);c.fillStyle='#c2c9cf';for(const i of [-9,-3,3,9]){c.beginPath();c.arc(i,-7.5,1,0,7);c.fill()}break;
  }
}

/* ---------- scene engine ---------- */
const G=.12;
class Scene{

    this.proj=[];this.parts=[];this.rings=[];this.shocks=[];this.bolts=[];this.texts=[];this.later=[];this.mounds=[];this.beams=[];

const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const bctx=bgc.getContext('2d');
const tc=document.createElement('canvas');tc.width=W;tc.height=H;const tctx=tc.getContext('2d',{willReadFrequently:true});
let solid=new Uint8Array(W*H);
const PORTRAIT=matchMedia('(max-width:820px) and (orientation:portrait),(max-width:560px)');
function fitCanvas(){
  let vw=W;
  if(PORTRAIT.matches&&!$('play').hidden){
    const cw=cv.parentElement.clientWidth||360;
    const used=$('play').offsetTop+document.querySelector('.console').offsetHeight+document.querySelector('.pad').offsetHeight+36;
    const ch=clamp(innerHeight-used,cw*.55,cw*1.4);
    cv.style.height=Math.round(ch)+'px';cv.style.aspectRatio='auto';
    vw=clamp(Math.round(H*cw/ch),480,W);
  }else{cv.style.height='';cv.style.aspectRatio=''}
  if(vw!==VW||cv.width!==vw){VW=vw;cv.width=vw;cv.height=H}
}
addEventListener('resize',()=>fitCanvas());if(PORTRAIT.addEventListener)PORTRAIT.addEventListener('change',()=>fitCanvas());
function sAt(x,y){x|=0;y|=0;if(x<0||x>=W||y<0||y>=H)return false;return solid[y*W+x]===1}
function setCircle(cx,cy,r,v){
  const y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(H-1,Math.ceil(cy+r));
  for(let y=y0;y<=y1;y++){const dy=y-cy,s=r*r-dy*dy;if(s<0)continue;const dx=Math.sqrt(s);
    const x0=Math.max(0,Math.ceil(cx-dx)),x1=Math.min(W-1,Math.floor(cx+dx));solid.fill(v,y*W+x0,y*W+x1+1);}
}

let AC=null,soundOn=true,musicOn=true,noiseBuf=null,master=null,sfxBus=null,musBus=null,musFilter=null,VM=1;
try{const a=JSON.parse(localStorage.getItem('potan-audio')||'null');if(a){soundOn=a.s!==false;musicOn=a.m!==false}}catch(e){}
function initAudio(){
  if(!AC){try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=.9;master.connect(comp);
    sfxBus=AC.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
    musFilter=AC.createBiquadFilter();musFilter.type='lowpass';musFilter.frequency.value=18000;musFilter.connect(master);
    musBus=AC.createGain();musBus.gain.value=musicOn?.42:0;musBus.connect(musFilter);
    setInterval(schedule,25);
  }catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function T0(o){return o.at??(AC.currentTime+(o.t||0))}
function env(g,t,a,v,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(type,f0,f1,dur,vol,o={}){
  const t=T0(o),att=o.att??.005,osc=AC.createOscillator(),g=AC.createGain();osc.type=type;osc.frequency.setValueAtTime(f0,t);
  if(f1!==f0)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+att+dur);if(o.det)osc.detune.value=o.det;
  env(g,t,att,vol*(o.dest?1:VM),dur);osc.connect(g).connect(o.dest||sfxBus);osc.start(t);osc.stop(t+att+dur+.05);
}
function noise(dur,vol,o={}){
  const t=T0(o),att=o.att??.003,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=o.type||'lowpass';f.Q.value=o.q??1;const f0=o.f0??1000,f1=o.f1??f0;
  f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+att+dur);
  const g=AC.createGain();env(g,t,att,vol*(o.dest?1:VM),dur);s.connect(f).connect(g).connect(o.dest||sfxBus);s.start(t,Math.random()*1.5);s.stop(t+att+dur+.05);
}

/* ---------------- tanks physics ---------------- */
function isGrounded(pl){for(const dx of [-6,-3,0,3,6])if(sAt(pl.x+dx,pl.y+1))return true;return false}
function gy(x,y){for(let k=-10;k<=14;k++)if(sAt(x,y+k))return y+k;return y+14}
function updTank(pl){
  if(pl.sunk)return;
  if(isGrounded(pl)){
    if(pl.falling){pl.falling=false;const d=pl.y-pl.fallStart;if(d>50&&pl.alive)hurt(pl,Math.min(40,Math.round((d-50)*.3)));pl.vy=0;}
  }else{
    if(!pl.falling){pl.falling=true;pl.fallStart=pl.y;pl.vy=0}
    pl.vy=Math.min(pl.vy+G*1.4,8);const n=Math.ceil(pl.vy);

      if(pl.alive){pl.hp=0;pl.alive=false;S.texts.push({x:pl.x,y:WATER-30,txt:S.theme.fall||'풍덩!',col:'#ffffff',life:80});}}
  }
  const tgt=clamp(Math.atan2(gy(pl.x+9,pl.y)-gy(pl.x-9,pl.y),18),-.5,.5);pl.tilt+=(tgt-pl.tilt)*.25;

function tryMove(pl,dir){

  let ny=pl.y,c=0;while(sAt(nx,ny)&&c<7){ny--;c++}
  if(sAt(nx,ny)||sAt(nx,ny-14)||sAt(nx+dir*7,ny-10))return;

  if(!pl.alive||a<=0)return;pl.hp=Math.max(0,pl.hp-a);sfx('clang');
  S.texts.push({x:pl.x+rand(-6,6),y:pl.y-34,txt:'-'+a,col:'#ff6b4a',life:70});
  if(pl.hp<=0){pl.alive=false;smoke(pl.x,pl.y-12,8,.9);shock(pl.x,pl.y-8,80,'255,160,90',7);S.rings.push({x:pl.x,y:pl.y-8,r:30,life:1,kind:'fire'});
    for(let i=0;i<24;i++)S.parts.push({x:pl.x,y:pl.y-8,vx:rand(-3,3),vy:rand(-5,-1),life:rand(40,80),max:80,col:i%2?'#3a3a3a':'#ff9a3c',size:rand(2,5),g:.15});sfx('boom',40);sfx('death');}
}
function healPl(pl,a){const b=pl.hp;pl.hp=Math.min(pl.maxHp,pl.hp+a);S.texts.push({x:pl.x,y:pl.y-34,txt:'+'+(pl.hp-b),col:'#7fd17a',life:70})}

/* ---------------- shooting ---------------- */
function aimVec(pl,ang=pl.angle,facing=pl.facing){const a=ang*Math.PI/180;return{dx:facing*Math.cos(a),dy:-Math.sin(a)}}
function muzzle(pl){const v=aimVec(pl),L=TANKS[pl.t].barrel+2;return{x:pl.x+v.dx*L,y:pl.y-17+v.dy*L,dx:v.dx,dy:v.dy}}
function shoot(pl,extra,mul=1){
  if(!pl.alive)return;const m=muzzle(pl);if(sAt(m.x,m.y))carve(m.x,m.y,10,false);
  const sp=VMAX*(pl.firePower/100)*(extra.spd||1)*mul;
  S.proj.push(Object.assign({x:m.x,y:m.y,vx:m.dx*sp,vy:m.dy*sp,type:'normal',r:30,dmg:20,gf:1,wf:1,owner:pl,age:0,size:4,col:'#1f2326',trail:[]},extra));
  sfx(extra.heavy?'fireHeavy':'fire');muzzleFx(pl,m);
}
function muzzleFx(pl,m,col='#ffcf6b'){pl.recoil=6;for(let i=0;i<12;i++){const a=Math.atan2(m.dy,m.dx)+rand(-.5,.5),s=rand(1.5,5);S.parts.push({x:m.x,y:m.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(8,16),max:16,col,size:rand(2,3.5),g:0})}smoke(m.x,m.y,3,.45)}
function chargeBeam(pl,extra){
  sfx('charge');
  const cols=['#ff8a8a','#ffd166','#9be36b','#7fe3ff','#c9a2ff'];
  for(let i=0;i<28;i++)later(i,()=>{const m=muzzle(pl);for(let j=0;j<2;j++){const a=rand(0,6.3),d=rand(30,60);S.parts.push({x:m.x+Math.cos(a)*d,y:m.y+Math.sin(a)*d,vx:-Math.cos(a)*d/14,vy:-Math.sin(a)*d/14,life:14,max:14,col:cols[(i+j)%5],size:2.5,g:0})}});
  later(2,()=>callout('충전…',pl.x,pl.y-60,'#e7dcff',26));
  later(30,()=>{flash(.35,'220,200,255');const m=muzzle(pl);shock(m.x,m.y,60,'210,190,255',5);muzzleFx(pl,m,'#e7dcff');beamShot(pl,extra)});
}
function beamShot(pl,extra){
  const m=muzzle(pl);if(sAt(m.x,m.y))carve(m.x,m.y,10,false);
  S.proj.push(Object.assign({x:m.x,y:m.y,vx:m.dx,vy:m.dy,type:'laser',owner:pl,age:0,path:[[m.x,m.y]],trail:[]},extra));sfx('beam');
}
function hitTank(p,ownerGrace=14){
  for(const pl of S.players){if(!pl.alive)continue;if(pl===p.owner&&p.age<ownerGrace)continue;
    const dx=p.x-pl.x,dy=p.y-(pl.y-8);if(dx*dx+dy*dy<169)return pl;}
  return null;
}
function nearestEnemy(owner,x,y,maxD=1e9){let best=null,bd=maxD;for(const pl of S.players){if(!pl.alive||pl===owner)continue;const d=Math.hypot(pl.x-x,pl.y-8-y);if(d<bd){bd=d;best=pl}}return best}
function reflect(p,px,py,damp){
  const sx=Math.sign(p.vx)||1,sy=Math.sign(p.vy)||1;const hx=sAt(px+sx*2,py),hy=sAt(px,py+sy*2);
  if(hx&&!hy)p.vx=-p.vx;else if(hy&&!hx)p.vy=-p.vy;else{p.vx=-p.vx;p.vy=-p.vy}
  p.vx*=damp;p.vy*=damp;p.x=px;p.y=py;
}
function splash(x,n=14){sfx('splash');for(let i=0;i<n;i++)S.parts.push({x:x+rand(-8,8),y:WATER,vx:rand(-2,2),vy:rand(-5,-2),life:rand(25,45),max:45,col:'#cfe9ff',size:rand(2,4),g:.25})}

function updProj(p){
  p.age++;
  if(p.type==='laser')return updLaser(p);
  if(p.rolling)return updRoll(p);
  if(p.drilling)return updDrill(p);
  if(p.type==='split'&&p.vy>=0){
    p.dead=true;sfx('pop');slowmo(26,.5);flash(.18,'255,200,140');shock(p.x,p.y,80,'255,180,110',5);
    for(let i=0;i<p.n;i++)S.proj.push({x:p.x,y:p.y,vx:p.vx+(i-(p.n-1)/2)*p.spread,vy:p.vy-.6,type:'normal',r:p.cr,dmg:p.cdmg,gf:1,wf:1,owner:p.owner,age:20,size:4,col:'#ffb36b',glow:true,trail:[]});
    burst(p.x,p.y,'#ffb36b',24);callout('분열!',p.x,p.y-30,'#ffb36b',30);return;
  }
  if(p.type==='cluster'&&p.vy>=0){
    p.dead=true;sfx('crackle');flash(.25,'255,230,170');slowmo(30,.5);shock(p.x,p.y,120,'255,210,120',5);
    const cols=['#ffd166','#ff8fbd','#7fe3ff','#9be36b','#ffffff'];
    for(let i=0;i<70;i++){const a=rand(0,6.283),s=rand(1.5,6.5);S.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(40,85),max:85,col:cols[i%5],size:rand(1.5,3),g:.05})}
    for(let i=0;i<p.n;i++)S.proj.push({x:p.x,y:p.y,vx:p.vx*.4+rand(-3,3),vy:rand(-2.5,0),type:'normal',r:p.cr,dmg:p.cdmg,gf:1,wf:1,owner:p.owner,age:20,size:3,col:cols[i%4],glow:true,colorful:true,trail:[]});
    callout('불꽃놀이!',p.x,p.y-34,'#ffd166',30);return;
  }
  if(p.type==='homing'&&p.age>12&&p.vy>-2&&(p.homeT=(p.homeT||0)+1)<130){
    const tg=nearestEnemy(p.owner,p.x,p.y);
    if(tg){
      if(!p.lock){callout('추적!',p.x,p.y-24,'#c9a2ff',26);sfx('zap');shock(p.x,p.y,45,'200,160,255',3)}
      p.lock=tg;
      const want=Math.atan2(tg.y-8-p.y,tg.x-p.x),cur0=Math.atan2(p.vy,p.vx);let d=want-cur0;
      while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
      const sp=Math.max(Math.hypot(p.vx,p.vy),5),na=cur0+clamp(d,-.05,.05);p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;p.gf=.12;}
  }else if(p.type==='homing'&&p.homeT>=130){p.gf=1;p.lock=null}
  if(p.lock&&S.frame%2===0)S.parts.push({x:p.x,y:p.y,vx:rand(-.7,.7),vy:rand(-.7,.7),life:26,max:26,col:'#b48cff',size:2.5,g:0});
  if(p.heavy&&S.frame%2===0)S.parts.push({x:p.x,y:p.y,vx:rand(-.3,.3),vy:rand(-.3,0),life:50,max:50,col:'rgba(70,70,70,.45)',size:p.size*.7,grow:.15,g:-.002,shape:'c'});
  p.vx+=S.wind*WIND_K*p.wf;p.vy+=G*p.gf;
  const sp=Math.hypot(p.vx,p.vy),n=Math.max(1,Math.ceil(sp/1.5));
  for(let i=0;i<n;i++){
    const px=p.x,py=p.y;p.x+=p.vx/n;p.y+=p.vy/n;
    if(p.x<-150||p.x>W+150||p.y>H+20){p.dead=true;return}
    if(p.y>=WATER){splash(p.x,22);p.dead=true;sfx('pop');return}
    const t=hitTank(p);if(t){impact(p,p.x,p.y,t);return}
    if(sAt(p.x,p.y)){onGround(p,px,py);return}
  }
  if(!S.slowUsed&&p.vy>0&&p.age>20){if(nearestEnemy(p.owner,p.x,p.y,100)){S.slowUsed=true;slowmo(40,.45)}}
  p.trail.push([p.x,p.y]);if(p.trail.length>(p.rainbow?24:16))p.trail.shift();
}
function onGround(p,px,py){
  if(p.type==='roll'){
    if(!p.rolling&&p.rollLeft==null){burst(px,py,S.theme.top,12);if((p.rollSpd||2.5)>=4){callout('부릉부릉!',px,py-40,'#ff9a3c',30);sfx('fire')}}
    p.rolling=true;p.x=px;p.y=py;if(p.rollLeft==null)p.rollLeft=p.roll;p.dir=Math.sign(p.vx)||p.owner.facing;p.spin=p.spin||0;return}
  if(p.type==='drill'){p.drilling=true;const s=Math.hypot(p.vx,p.vy)||1;p.dx=p.vx/s;p.dy=p.vy/s;p.drillLeft=p.drill;
    shock(px,py,40,'230,220,200',4);callout('드르륵!',px,py-36,'#d8d2c4',26);return}
  if(p.type==='bounce'&&p.bounces>0){reflect(p,px,py,.62);p.bounces--;sfx('bounce');
    const cols=['#ff8fbd','#ffd166','#7fe3ff'];for(let i=0;i<16;i++){const a=rand(Math.PI,2*Math.PI),s=rand(1.5,4);S.parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(20,40),max:40,col:cols[i%3],size:2.5,g:.1})}
    shock(px,py,36,'255,160,200',4);callout('통!',px,py-28,'#ff8fbd',24);return}
  impact(p,p.x,p.y,null);
}
function updRoll(p){
  sfx('rumble');
  const fast=(p.rollSpd||2.5)>=4,steps=Math.ceil(p.rollSpd||2.5);
  S.parts.push({x:p.x-p.dir*p.size,y:p.y-1,vx:-p.dir*rand(.3,1.2),vy:rand(-1.2,-.2),life:26,max:26,col:'rgba(150,120,90,.5)',size:rand(2,4),grow:.12,g:0,shape:'c'});
  if(fast){S.shake=Math.max(S.shake,1.6);S.parts.push({x:p.x-p.dir*p.size,y:p.y-p.size,vx:-p.dir*rand(1,2.5),vy:rand(-1,0),life:18,max:18,col:Math.random()<.5?'#ff9a3c':'#ffd166',size:rand(2,4),g:-.02,shape:'c'})}
  for(let k=0;k<steps;k++){
    const nx=p.x+p.dir;if(nx<0||nx>=W){p.dead=true;return}
    let ny=p.y;if(sAt(nx,ny)){let c=0;while(sAt(nx,ny)&&c<5){ny--;c++}if(sAt(nx,ny)){impact(p,p.x,p.y,null);return}}
    p.x=nx;p.y=ny;let d=0;while(!sAt(p.x,p.y+1)&&d<5){p.y++;d++}
    if(!sAt(p.x,p.y+1)){p.rolling=false;p.vx=p.dir*(p.rollSpd||2.5);p.vy=.5;return}
    if(p.y>=WATER){splash(p.x);p.dead=true;return}
    p.rollLeft--;p.spin+=p.dir*.35;
    const t=hitTank(p);if(t){impact(p,p.x,p.y,t);return}
    if(p.rollLeft<=0){impact(p,p.x,p.y,null);return}
  }
  p.trail.push([p.x,p.y-p.size]);if(p.trail.length>10)p.trail.shift();
}
function updDrill(p){
  sfx('drill');
  S.shake=Math.max(S.shake,2.5);
  if(p.age%5===0){let sy=p.y;while(sy>0&&sAt(p.x,sy))sy--;
    if(sy<p.y-4)for(let i=0;i<5;i++)S.parts.push({x:p.x+rand(-6,6),y:sy,vx:rand(-1,1),vy:rand(-5,-2.5),life:rand(25,40),max:40,col:Math.random()<.5?S.theme.soil[0]:S.theme.top,size:rand(2,3.5),g:.25});}
  for(let k=0;k<3;k++){
    p.x+=p.dx*1.5;p.y+=p.dy*1.5;p.drillLeft-=1.5;
    if(p.x<0||p.x>=W||p.y>=WATER){p.dead=true;return}
    if(k===0){carve(p.x,p.y,6,false);S.parts.push({x:p.x,y:p.y,vx:rand(-1.5,1.5),vy:rand(-2,0),life:20,max:20,col:'#ffd36b',size:1.8,g:.15})}
    const t=hitTank(p);if(t){impact(p,p.x,p.y,t);return}
    if(p.drillLeft<=0){impact(p,p.x,p.y,null);return}
  }
}
function updLaser(p){
  for(let k=0;k<14;k++){
    const px=p.x,py=p.y;p.x+=p.vx;p.y+=p.vy;
    if(p.x<-10||p.x>W+10||p.y<-300||p.y>=WATER||p.age>500){p.path.push([p.x,p.y]);endBeam(p);p.dead=true;return}
    const t=hitTank(p,4);if(t){p.path.push([p.x,p.y]);endBeam(p);impact(p,p.x,p.y,t);return}
    if(sAt(p.x,p.y)){
      if(p.bounces>0){reflect(p,px,py,1);p.bounces--;p.path.push([p.x,p.y]);burst(p.x,p.y,'#e7dcff',14);carve(p.x,p.y,8,false);
        shock(p.x,p.y,50,'210,190,255',4);flash(.15,'220,200,255');callout('반사!',p.x,p.y-26,'#e7dcff',24);sfx('zap')}
      else{p.path.push([p.x,p.y]);endBeam(p);impact(p,p.x,p.y,null);return}
    }
  }
}
function endBeam(p){S.beams.push({pts:p.path.slice(),life:40})}

function vortex(x,y,inward){

}
function healFx(o){
  if(!o.alive)return;shock(o.x,o.y-8,70,'170,240,160',5);
  for(let i=0;i<40;i++)S.parts.push({x:o.x+rand(-16,16),y:o.y-rand(0,20),vx:rand(-.3,.3),vy:-rand(1,3),life:rand(40,70),max:70,col:i%3?'#b6f5a8':'#ffffff',size:rand(1.5,3),g:-.01});
  for(let i=0;i<14;i++)S.parts.push({x:o.x+rand(-30,30),y:o.y-rand(30,60),vx:rand(-1,1),vy:rand(-1.5,-.4),life:rand(60,90),max:90,col:'#ffb3d1',size:rand(2,3.5),g:.02,shape:'c'});

function growDirt(x,y,r){
  for(let k=0;k<6;k++)later(k*4,()=>{addDirt(x,y,r*(.45+k*.11));S.shake=Math.max(S.shake,2);
    for(let i=0;i<6;i++)S.parts.push({x:x+rand(-r,r)*.6,y:y-r*(.45+k*.11),vx:rand(-1.5,1.5),vy:rand(-3,-1),life:30,max:30,col:i%2?S.theme.dirt:'#8fe06a',size:rand(2,3.5),g:.18})});

function bolt(x0,y0,x1,y1,branches,amp=10,life=22){
  const main=jag(x0,y0,x1,y1,10,amp);S.bolts.push({pts:main,life,max:life,w:1});
  for(let b=0;b<branches;b++){const s=main[ri(2,main.length-3)];S.bolts.push({pts:jag(s[0],s[1],s[0]+rand(-50,50),s[1]+rand(10,60),5,7),life:life-4,max:life,w:.55})}
}

function impact(p,x,y,tank){
  p.dead=true;const o=p.owner;
  switch(p.type){
    case 'teleport':{
      if(!o.alive)break;let tx=clamp(x,14,W-14),ty=y;
      if(tank){tx=clamp(tank.x+(o.x<tank.x?-28:28),14,W-14);ty=tank.y-20}
      for(let k=0;k<200&&(sAt(tx,ty)||sAt(tx,ty-12));k++)ty--;
      vortex(o.x,o.y-8,true);shock(o.x,o.y-8,50,'200,160,255',5);
      o.x=tx;o.y=ty;o.fallStart=ty;o.falling=false;
      vortex(tx,ty-8,false);shock(tx,ty-8,70,'200,160,255',6);flash(.35,'200,160,255');
      callout('순간이동!',tx,ty-60,'#e3c8ff',30);S.focus={x:tx,y:ty};sfx('tp');break;}
    case 'dirt':explode(x,y,p.r,p.dmg,o);growDirt(x,y-12,p.mound);break;
    case 'heal':explode(x,y,p.r,p.dmg,o,{heal:p.heal,crater:false});healFx(o);sfx('heal');break;
    case 'chain':{
      explode(x,y,p.r,p.dmg,o,{tint:'200,240,255'});const t=nearestEnemy(o,x,y,p.zap);
      if(t){later(8,()=>{if(!t.alive)return;bolt(x,y,t.x,t.y-8,3);flash(.3,'200,240,255');hurt(t,p.zapDmg);burst(t.x,t.y-8,'#7fe3ff',18);shock(t.x,t.y-8,40,'127,227,255',4);callout('찌릿!',t.x,t.y-62,'#7fe3ff',28);sfx('zap')})}
      break;}
    case 'storm':explode(x,y,p.r,p.dmg,o,{tint:'200,240,255'});S.dimT=.6;callout('먹구름!',x,y-50,'#cfe6f0',30);
      [-60,0,60].forEach((dx,i)=>later(22+i*18,()=>strike(x+dx+rand(-8,8),o)));break;
    case 'drill':explode(x,y,p.r,p.dmg,o,{column:true});if(p.r>=70){S.quake=50;callout('쿠구궁!',x,y-80,'#ffcf6b',46)}break;
    default:explode(x,y,p.r,p.dmg,o,{mega:p.mega,colorful:p.colorful});
  }
}
function jag(x0,y0,x1,y1,n,amp){const pts=[[x0,y0]];for(let i=1;i<n;i++){const t=i/n;pts.push([x0+(x1-x0)*t+rand(-amp,amp),y0+(y1-y0)*t+rand(-amp,amp)])}pts.push([x1,y1]);return pts}
function strike(x,owner){
  x=clamp(x,4,W-4);let y=0;
  for(y=0;y<WATER;y++){if(sAt(x,y))break;if(S.players.some(pl=>pl.alive&&Math.abs(pl.x-x)<13&&y>pl.y-20&&y<pl.y))break}
  bolt(x+rand(-20,20),-60,x,y,4,16,26);flash(.55,'225,240,255');sfx('thunder');
  if(y<WATER){explode(x,y,30,18,owner,{tint:'190,235,255'});for(let i=0;i<14;i++)S.parts.push({x,y,vx:rand(-3,3),vy:rand(-5,-1),life:rand(15,30),max:30,col:'#dff6ff',size:2,g:.15})}
}
function mushroom(x,y,r){
  for(let i=0;i<28;i++)S.parts.push({x:x+rand(-r*.18,r*.18),y:y-rand(0,20),vx:rand(-.2,.2),vy:-rand(1.6,2.8),life:rand(80,110),max:110,col:'rgba(95,82,70,.55)',size:rand(8,14),grow:.25,g:.012,shape:'c'});
  for(let i=0;i<24;i++){const a=rand(Math.PI,2*Math.PI);S.parts.push({x:x+Math.cos(a)*r*.35,y:y-r*1.1+Math.sin(a)*r*.25,vx:Math.cos(a)*1.3,vy:Math.sin(a)*.5-1.1,life:rand(90,130),max:130,col:'rgba(125,104,88,.5)',size:rand(10,18),grow:.3,g:.008,shape:'c'})}
  for(let i=0;i<30;i++){const a=rand(0,6.283),s=rand(1,4);S.parts.push({x,y:y-r*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:rand(25,45),max:45,col:i%2?'#ff9a3c':'#ffe08a',size:rand(5,9),grow:.1,g:-.02,shape:'c'})}
}
function explode(x,y,r,dmg,owner,o={}){
  if(o.crater!==false)carve(x,y,r,true);
  let best=0,killed=false;
  for(const pl of S.players){if(!pl.alive)continue;const d=Math.hypot(pl.x-x,pl.y-8-y),reach=r+12;
    if(d<reach){const f=1-d/reach;if(o.heal&&pl===owner)healPl(pl,o.heal);
      else{const amt=Math.round(dmg*(.35+.65*f));hurt(pl,amt);if(pl!==owner){best=Math.max(best,amt);if(!pl.alive)killed=true}}}}
  S.rings.push({x,y,r,life:1,kind:o.heal?'heal':'fire'});
  const th=S.theme;
  if(o.crater!==false){
    for(let i=0;i<Math.min(44,r*.75);i++){const a=rand(Math.PI*1.05,Math.PI*1.95),s=rand(1.5,5.5);
      S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(30,60),max:60,col:Math.random()<.5?th.soil[0]:th.top,size:rand(2,4.5),g:.2})}

/* ---------------- turn flow ---------------- */

  pl.firePower=Math.max(5,Math.round(S.power));pl.lastPower=pl.firePower;
  if(S.weapon===1)pl.cd=w.cd+1;
  S.charging=false;S.phase='flight';S.settle=0;w.fire(pl);
  if(S.weapon===1)callout(w.name+'!',pl.x,pl.y-74,pl.col,34);
}
function beginTurn(){

  S.wind=clamp(Math.round(ri(-10,10)*(S.theme.wind??1)),-12,12);S.upT=S.dnT=0;S.dimT=0;S.focus=null;S.slowUsed=false;

/* ---------------- AI ---------------- */
function simShot(pl,facing,ang,pow,sim){
  const v=aimVec(pl,ang,facing),L=TANKS[pl.t].barrel+2;let x=pl.x+v.dx*L,y=pl.y-17+v.dy*L;
  const sp=VMAX*pow/100*(sim.spd||1);let vx=v.dx*sp,vy=v.dy*sp;const gf=sim.gf??1,wf=sim.wf??1;
  for(let f=0;f<500;f++){
    vx+=S.wind*WIND_K*wf;vy+=G*gf;const n=Math.max(1,Math.ceil(Math.hypot(vx,vy)/3));
    for(let i=0;i<n;i++){x+=vx/n;y+=vy/n;
      if(x<-150||x>W+150||y>=WATER)return null;
      for(const o of S.players){if(!o.alive||(o===pl&&f<14))continue;const dx=x-o.x,dy=y-(o.y-8);if(dx*dx+dy*dy<169)return{x,y}}
      if(sAt(x,y))return{x,y};}
  }
  return null;
}
function aiPlan(pl){
  const td=TANKS[pl.t];let wi=0,target,selfTarget=false;
  const enemies=S.players.filter(p=>p.alive&&p!==pl);
  if(td.w[1].ai==='heal'&&pl.cd===0&&pl.hp<pl.maxHp*.55){wi=1;target={x:pl.x,y:pl.y-8};selfTarget=true}
  else{
    enemies.sort((a,b)=>Math.abs(a.x-pl.x)+a.hp*2-Math.abs(b.x-pl.x)-b.hp*2+rand(-120,120));
    const e=enemies[0];target={x:e.x,y:e.y-8};
    if(td.w[1].ai==='attack'&&pl.cd===0&&Math.random()<.55)wi=1;
  }
  const sim=td.w[wi].sim||{};
  const facings=selfTarget?[-1,1]:[Math.sign(target.x-pl.x)||1];
  let best=null,bd=1e9;
  for(const fc of facings)for(let a=td.amin;a<=td.amax;a+=2)for(let pw=10;pw<=100;pw+=3){
    const r=simShot(pl,fc,a,pw,sim);if(!r)continue;
    let d=Math.hypot(r.x-target.x,r.y-target.y);
    if(!selfTarget&&Math.hypot(r.x-pl.x,r.y-pl.y+8)<70)d+=600;
    if(d<bd){bd=d;best={facing:fc,angle:a,power:pw}}
  }
  if(!best)best={facing:Math.sign(target.x-pl.x)||1,angle:clamp(45,td.amin,td.amax),power:60};
  const E=[[6,8],[3,4],[1,1]][S.diff];
  best.angle=clamp(best.angle+ri(-E[0],E[0]),td.amin,td.amax);best.power=clamp(best.power+rand(-E[1],E[1]),8,100);best.wi=wi;
  return best;
}
function aiUpdate(pl){
  const A=S.ai;if(!A)return;
  if(A.stage==='plan'){if(--A.t<=0){Object.assign(A,aiPlan(pl));A.stage='turn';A.t=10}}
  else if(A.stage==='turn'){pl.facing=A.facing;S.weapon=A.wi;if(--A.t<=0)A.stage='angle'}
  else if(A.stage==='angle'){if(S.frame%2===0){if(pl.angle<A.angle)pl.angle++;else if(pl.angle>A.angle)pl.angle--;else{A.stage='charge';S.charging=true;S.power=0}}}
  else if(A.stage==='charge'){S.power+=1.2;if(S.power>=A.power){S.power=A.power;fire()}}
}

/* ---------------- update ---------------- */
function updAim(){
  const pl=cur();if(!pl.alive){S.phase='flight';return}
  if(!pl.human){aiUpdate(pl);return}
  S.timer--;if(S.timer>0&&S.timer<=300&&S.timer%60===0)sfx('tick2');
  if(S.timer<=0){if(S.charging)fire();else{S.phase='flight';S.texts.push({x:pl.x,y:pl.y-50,txt:'시간 초과',col:'#ffffff',life:70})}return}
  if(input.left&&!input.right)tryMove(pl,-1);else if(input.right&&!input.left)tryMove(pl,1);
  const td=TANKS[pl.t];
  if(input.up){if(S.upT===0||(S.upT>14&&S.upT%3===0)){if(pl.angle<td.amax)sfx('tick');pl.angle=Math.min(td.amax,pl.angle+1)}S.upT++}else S.upT=0;
  if(input.down){if(S.dnT===0||(S.dnT>14&&S.dnT%3===0)){if(pl.angle>td.amin)sfx('tick');pl.angle=Math.max(td.amin,pl.angle-1)}S.dnT++}else S.dnT=0;
  if(S.needRelease){if(!input.fire)S.needRelease=false;return}
  if(input.fire){if(!S.charging){if(S.weapon===1&&pl.cd>0)return;S.charging=true;S.power=0}else{S.power+=1.2;if(S.power>=100){S.power=100;fire()}}}
  else if(S.charging)fire();
}
function update(){
  if(S.phase==='setup'||S.paused)return;S.frame++;
  S.dim+=(S.dimT-S.dim)*.05;S.punch*=.94;
  if(S.freeze>0){S.freeze--;return}
  S.flash.a*=.86;
  if(S.slowT>0)S.slowT--;
  if(S.quake>0){S.quake--;S.shake=Math.max(S.shake,5)}
  if(S.phase==='aim')updAim();
  chargeTone(S.phase==='aim'&&S.charging?S.power:-1);
  for(let i=S.pending.length-1;i>=0;i--){if(--S.pending[i].t<=0){const f=S.pending[i].fn;S.pending.splice(i,1);f()}}
  for(let i=0;i<S.proj.length;i++)updProj(S.proj[i]);
  S.proj=S.proj.filter(p=>!p.dead);
  for(const pl of S.players){updTank(pl);pl.recoil=(pl.recoil||0)*.8}
  for(const p of S.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(p.grow)p.size+=p.grow;p.life--}S.parts=S.parts.filter(p=>p.life>0);
  if(S.parts.length>1400)S.parts.splice(0,S.parts.length-1400);
  for(const r of S.rings)r.life-=.05;S.rings=S.rings.filter(r=>r.life>0);
  for(const s of S.shocks){s.r+=(s.max-s.r)*.14;s.life-=.045}S.shocks=S.shocks.filter(s=>s.life>0);
  for(const t of S.texts){t.y-=t.big?.25:.5;t.life--}S.texts=S.texts.filter(t=>t.life>0);
  for(const b of S.bolts)b.life--;S.bolts=S.bolts.filter(b=>b.life>0);
  for(const b of S.beams)b.life--;S.beams=S.beams.filter(b=>b.life>0);
  if(S.banner&&--S.banner.life<=0)S.banner=null;
  if(S.phase==='flight'){
    if(!S.proj.length&&!S.pending.length&&!S.bolts.length&&S.players.every(p=>!p.falling)){
      if(++S.settle>50){S.settle=0;if(!checkWin())nextTurn()}
    }else S.settle=0;
  }
  S.shake*=.86;
}

    return{idx:s.idx,t:s.t,human:s.mode==='human',col:PCOL[s.idx],x,y,vy:0,hp:td.hp,maxHp:td.hp,facing:x<W/2?1:-1,angle:Math.round((td.amin+td.amax)/2),
      fuel:td.fuel,cd:0,alive:true,falling:false,fallStart:y,tilt:0,lastPower:0,firePower:0,sunk:false}});
  Object.assign(S,{proj:[],pending:[],parts:[],rings:[],texts:[],bolts:[],beams:[],shocks:[],shake:0,settle:0,dim:0,dimT:0,freeze:0,slowT:0,quake:0,punch:0,focus:null});S.flash.a=0;S.gray=0;cam.x=W/2;cam.y=H/2;cam.z=1;
  S.turn=ri(0,S.players.length-1);
  $('setup').hidden=true;$('play').hidden=false;$('hTitle').hidden=false;fitCanvas();$('backBtn').hidden=false;$('over').hidden=true;
  for(const k in hudCache)delete hudCache[k];
  beginTurn();
}
function toSetup(){S.phase='setup';applyMapLook(S.map==='random'?'dusk':S.map);setTimeout(pumpThumbs,60);S.paused=false;music('title');muffle(false);chargeTone(-1);$('hTitle').hidden=true;if(stageScene)stageScene.reset();$('play').hidden=true;$('setup').hidden=false;$('backBtn').hidden=true;$('over').hidden=true}
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('toSetupBtn').onclick=toSetup;$('backBtn').onclick=()=>{if(S.phase==='over'||S.phase==='setup'){toSetup();return}
  S.paused=true;for(const k in input)input[k]=false;chargeTone(-1);$('quitModal').hidden=false;$('quitNo').focus()};
function closeQuit(){$('quitModal').hidden=true;for(const k in input)input[k]=false;S.needRelease=true;S.paused=false}
$('quitNo').onclick=closeQuit;
$('quitYes').onclick=()=>{closeQuit();toSetup()};
$('quitModal').addEventListener('click',e=>{if(e.target.id==='quitModal')closeQuit()});
addEventListener('keydown',e=>{if(!$('quitModal').hidden&&e.key==='Escape')closeQuit()});
$('sndBtn').onclick=()=>{soundOn=!soundOn;if(!soundOn)chargeTone(-1);saveAudio();syncAudioBtns();initAudio()};
$('musBtn').onclick=()=>{musicOn=!musicOn;initAudio();if(AC)musBus.gain.setTargetAtTime(musicOn?.42:0,AC.currentTime,.1);saveAudio();syncAudioBtns()};
syncAudioBtns();music('title');
$('w0').onclick=()=>{if(S.phase==='aim'&&cur().human&&!S.charging)S.weapon=0};
$('w1').onclick=()=>{if(S.phase==='aim'&&cur().human&&!S.charging&&cur().cd===0)S.weapon=1};

/* ---------------- input ---------------- */
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',' ':'fire',Spacebar:'fire'};
addEventListener('keydown',e=>{
  if(S.phase==='setup')return;
  if(S.paused)return;
  const k=KEYMAP[e.key];if(k){input[k]=true;e.preventDefault()}
  if(e.key==='1')$('w0').click();if(e.key==='2')$('w1').click();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k){input[k]=false;if(S.phase!=='setup')e.preventDefault()}});
addEventListener('blur',()=>{for(const k in input)input[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();input[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{input[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;const st=STEP/(S.slowT>0?S.slowK:1);let n=0;while(acc>=st&&n<4){update();acc-=st;n++}
  if(S.phase!=='setup')render();hud();requestAnimationFrame(loop)}
initSetup();
requestAnimationFrame(loop);
})();
</script>
